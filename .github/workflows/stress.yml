name: Stress

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: cardianatomy-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adversarial:
    name: Python ${{ matrix.python-version }} · seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        seed: [101, 202, 303]
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONMALLOC: "debug"
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Run adversarial suite
        run: >-
          pytest -q tests/test_stress_*.py
          --hypothesis-seed=${{ matrix.seed }}
      - name: Re-run stateful pipeline stress
        run: pytest -q tests/test_stress_pipeline.py
      - name: Verify schemas remain synchronized
        run: python scripts/generate_schemas.py --check
